[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-simulation-engine"
version = "0.1.0"
description = "Production-grade, modular AI-orchestrated math/physics simulation platform"
readme = "README.md"
authors = [{ name = "Antigravity AI Team" }]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "sympy>=1.12",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "typer[all]>=0.9.0",
    "matplotlib>=3.8.0",
    "plotly>=5.19.0",
]

[project.optional-dependencies]
ai = [
    "openai>=1.14.0",
    "anthropic>=0.18.0",
]
db = [
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
]
viz = [
    "pyvista>=0.43.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.98.0",
    "httpx>=0.27.0",
]
quality = [
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "black>=24.2.0",
]
dev = [
    "ai-simulation-engine[ai,db,viz,test,quality]",
]

[project.scripts]
ai-sim = "ai_simulation_engine.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
